name: Deploy

on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            generated-${{ runner.os }}-${{ github.ref_name }}-
            generated-${{ runner.os }}-

      - name: Deploy web
        id: deploy_web
        run: |
          started_at=$(date +%s)
          bun run deploy:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy admin
        id: deploy_admin
        run: |
          started_at=$(date +%s)
          bun run deploy:admin
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save generated web inputs
        if: success()
        uses: actions/cache/save@v4
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Job"
            echo
            echo "- generated cache exact hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:web | ${{ steps.deploy_web.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:admin | ${{ steps.deploy_admin.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
