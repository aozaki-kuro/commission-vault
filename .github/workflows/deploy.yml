name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deploy-web:
    name: Deploy Web
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/generated
          # Same key as ci.yml web-remote-validate — will get an exact hit
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Deploy web
        id: deploy_web
        run: |
          started_at=$(date +%s)
          bun run deploy:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_BUILD_CACHE_TOKEN: deploy-${{ github.event.workflow_run.head_sha }}

      - name: Deploy web summary
        if: always()
        run: |
          {
            echo "## Deploy Web Job"
            echo
            echo "- generated cache exact hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:web | ${{ steps.deploy_web.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-admin:
    name: Deploy Admin
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-master-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-master-
            turbo-${{ runner.os }}-

      - name: Deploy admin
        id: deploy_admin
        run: |
          started_at=$(date +%s)
          bun run deploy:admin
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy admin summary
        if: always()
        run: |
          {
            echo "## Deploy Admin Job"
            echo
            echo "- turbo cache exact hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:admin | ${{ steps.deploy_admin.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
