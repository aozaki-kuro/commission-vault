name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  detect-cloudflare:
    name: Detect Cloudflare Credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Detect credentials
        id: detect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Detect generated web inputs
        id: generated_inputs
        run: |
          if [ -f apps/web/generated/fact-source/content.json ] && [ -f apps/web/generated/fact-source/source-images-manifest.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        id: lint
        run: |
          started_at=$(date +%s)
          bun run lint
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Test
        id: test
        run: |
          started_at=$(date +%s)
          bun run test
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        id: typecheck
        run: |
          started_at=$(date +%s)
          bun run typecheck
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Astro check web workspace from cached generated inputs
        if: steps.generated_inputs.outputs.available == 'true'
        id: check_web_cached
        run: |
          started_at=$(date +%s)
          bun run --cwd apps/web check:astro
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Skip cached Astro check without generated inputs
        if: steps.generated_inputs.outputs.available != 'true'
        run: echo "Generated web inputs are unavailable; skipping cached Astro check."

      - name: Build admin
        id: build_admin
        run: |
          started_at=$(date +%s)
          bun run build:admin
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Validation summary
        if: always()
        run: |
          {
            echo "## Validate Job"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| lint | ${{ steps.lint.outputs.duration_seconds || 'n/a' }} |"
            echo "| test | ${{ steps.test.outputs.duration_seconds || 'n/a' }} |"
            echo "| typecheck | ${{ steps.typecheck.outputs.duration_seconds || 'n/a' }} |"
            echo "| astro check (cached generated) | ${{ steps.check_web_cached.outputs.duration_seconds || 'n/a' }} |"
            echo "| build:admin | ${{ steps.build_admin.outputs.duration_seconds || 'n/a' }} |"
            echo
            echo "- turbo cache hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
            echo "- generated cache exact hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
            echo "- generated inputs available: ${{ steps.generated_inputs.outputs.available }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web-remote-validate:
    name: Web Remote Validate
    runs-on: ubuntu-latest
    needs: [detect-cloudflare, validate]
    if: needs.detect-cloudflare.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Export fact source from D1/R2
        id: export_fact_source
        run: |
          started_at=$(date +%s)
          bun run web:fact-source:export
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Astro check web workspace
        id: check_web
        run: |
          started_at=$(date +%s)
          bun run --cwd apps/web check:astro
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Build web workspace
        id: build_web
        run: |
          started_at=$(date +%s)
          bun run --cwd apps/web build:astro
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Web remote validation summary
        if: always()
        run: |
          {
            echo "## Web Remote Validate Job"
            echo
            echo "- cloudflare credentials enabled: ${{ needs.detect-cloudflare.outputs.enabled }}"
            echo "- generated cache exact hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| export fact source | ${{ steps.export_fact_source.outputs.duration_seconds || 'n/a' }} |"
            echo "| astro check | ${{ steps.check_web.outputs.duration_seconds || 'n/a' }} |"
            echo "| astro build | ${{ steps.build_web.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
