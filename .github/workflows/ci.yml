name: CI / Deploy

on:
  pull_request:
  push:
    branches: [master]

# On PRs: cancel outdated runs freely.
# On master: never cancel — we don't want a deploy killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # VALIDATE — runs on every PR and every push to master
  #
  # Lint, typecheck, test, and build admin via turbo (parallel internally).
  # Also runs a best-effort astro check when generated inputs are cached from
  # a previous master run.
  #
  # Turbo cache is saved here so the admin deploy job can restore it and skip
  # the rebuild entirely.
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      # Use cache/restore (not cache) so we control the save step explicitly
      # and avoid the "another job is creating this cache" race condition.
      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-master-
            turbo-${{ runner.os }}-

      # Restore generated inputs for a best-effort astro check on PRs.
      # Key matches what the web job saves, so active branches usually get
      # a hit from a recent master run.
      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Detect generated web inputs
        id: generated_inputs
        run: |
          if [ -f apps/web/generated/fact-source/content.json ] && \
             [ -f apps/web/generated/fact-source/source-images-manifest.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        id: lint
        run: |
          started_at=$(date +%s)
          bun run lint
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Test
        id: test
        run: |
          started_at=$(date +%s)
          bun run test
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        id: typecheck
        run: |
          started_at=$(date +%s)
          bun run typecheck
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Build admin
        id: build_admin
        run: |
          started_at=$(date +%s)
          bun run build:admin
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Astro check (cached generated inputs)
        if: steps.generated_inputs.outputs.available == 'true'
        id: check_web_cached
        run: bun run --cwd apps/web check:astro

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Validate"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| lint | ${{ steps.lint.outputs.duration_seconds || 'n/a' }} |"
            echo "| test | ${{ steps.test.outputs.duration_seconds || 'n/a' }} |"
            echo "| typecheck | ${{ steps.typecheck.outputs.duration_seconds || 'n/a' }} |"
            echo "| build:admin | ${{ steps.build_admin.outputs.duration_seconds || 'n/a' }} |"
            echo
            echo "- turbo cache hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
            echo "- generated inputs available: ${{ steps.generated_inputs.outputs.available }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # WEB — master only, runs after validate
  #
  # Exports fresh fact source data from Cloudflare D1/R2, validates the Astro
  # build, then deploys the web worker. Saves generated inputs to cache so
  # future PR validate runs can do a best-effort astro check without
  # hitting D1/R2 again, and so rebuild.yml can restore them.
  # ────────────────────────────────────────────────────────────────────────────
  web:
    name: Web — Export, Check & Deploy
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Export fact source from D1/R2
        id: export
        run: |
          started_at=$(date +%s)
          bun run web:fact-source:export
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Astro check
        id: check
        run: |
          started_at=$(date +%s)
          bun run --cwd apps/web check:astro
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Deploy web
        id: deploy
        run: |
          started_at=$(date +%s)
          bun run deploy:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_BUILD_CACHE_TOKEN: deploy-${{ github.sha }}

      # Save after a successful deploy so PRs and rebuild.yml can restore it.
      - name: Save generated web inputs
        if: success()
        uses: actions/cache/save@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Web — Export, Check & Deploy"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| export fact source | ${{ steps.export.outputs.duration_seconds || 'n/a' }} |"
            echo "| astro check | ${{ steps.check.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:web | ${{ steps.deploy.outputs.duration_seconds || 'n/a' }} |"
            echo
            echo "- generated cache hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # ADMIN — master only, runs after validate (in parallel with web)
  #
  # Restores the turbo cache saved by validate so deploy:admin can skip
  # rebuilding the admin app entirely.
  # ────────────────────────────────────────────────────────────────────────────
  admin:
    name: Admin — Deploy
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-master-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-master-
            turbo-${{ runner.os }}-

      - name: Deploy admin
        id: deploy
        run: |
          started_at=$(date +%s)
          bun run deploy:admin
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Admin — Deploy"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:admin | ${{ steps.deploy.outputs.duration_seconds || 'n/a' }} |"
            echo
            echo "- turbo cache hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
