name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Lint
        id: lint
        run: |
          started_at=$(date +%s)
          bun run lint
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Test
        id: test
        run: |
          started_at=$(date +%s)
          bun run test
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        id: typecheck
        run: |
          started_at=$(date +%s)
          bun run typecheck
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Build admin
        id: build_admin
        run: |
          started_at=$(date +%s)
          bun run build:admin
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Validation summary
        if: always()
        run: |
          {
            echo "## Validate Job"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| lint | ${{ steps.lint.outputs.duration_seconds || 'n/a' }} |"
            echo "| test | ${{ steps.test.outputs.duration_seconds || 'n/a' }} |"
            echo "| typecheck | ${{ steps.typecheck.outputs.duration_seconds || 'n/a' }} |"
            echo "| build:admin | ${{ steps.build_admin.outputs.duration_seconds || 'n/a' }} |"
            echo
            echo "- turbo cache hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web-remote-validate:
    name: Web Remote Validate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Detect Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore turbo cache
        if: steps.cloudflare.outputs.enabled == 'true'
        id: turbo_cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Restore source images cache
        if: steps.cloudflare.outputs.enabled == 'true'
        id: source_images_cache
        uses: actions/cache@v5
        with:
          path: apps/web/generated/source-images
          key: source-images-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            source-images-${{ github.ref_name }}-
            source-images-

      - name: Export fact source from D1/R2
        if: steps.cloudflare.outputs.enabled == 'true'
        id: export_fact_source
        run: |
          started_at=$(date +%s)
          bun run web:fact-source:export
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Astro check web workspace
        if: steps.cloudflare.outputs.enabled == 'true'
        id: check_web
        run: |
          started_at=$(date +%s)
          bun run --cwd apps/web check:astro
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Build web workspace
        if: steps.cloudflare.outputs.enabled == 'true'
        id: build_web
        run: |
          started_at=$(date +%s)
          bun run --cwd apps/web build:astro
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Skip web remote validation without Cloudflare credentials
        if: steps.cloudflare.outputs.enabled != 'true'
        run: echo "Cloudflare credentials are unavailable; skipping remote web validation."

      - name: Web remote validation summary
        if: always()
        run: |
          {
            echo "## Web Remote Validate Job"
            echo
            echo "- cloudflare credentials enabled: ${{ steps.cloudflare.outputs.enabled }}"
            echo "- turbo cache hit: ${{ steps.turbo_cache.outputs.cache-hit || 'n/a' }}"
            echo "- source-images cache hit: ${{ steps.source_images_cache.outputs.cache-hit || 'n/a' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| export fact source | ${{ steps.export_fact_source.outputs.duration_seconds || 'n/a' }} |"
            echo "| astro check | ${{ steps.check_web.outputs.duration_seconds || 'n/a' }} |"
            echo "| astro build | ${{ steps.build_web.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
