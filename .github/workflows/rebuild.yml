name: Rebuild Web

on:
  repository_dispatch:
    types: [admin-data-changed]
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-release-master-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-release-master-
            turbo-${{ runner.os }}-master-
            turbo-${{ runner.os }}-

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-rebuild-${{ github.run_id }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Deploy web worker
        id: deploy_web
        run: |
          started_at=$(date +%s)
          bun run deploy:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_BUILD_CACHE_TOKEN: rebuild-${{ github.event.client_payload.fact_source_version || github.run_id }}

      - name: Save turbo cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-release-master-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

      - name: Save generated web inputs
        if: success()
        uses: actions/cache/save@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-rebuild-${{ github.run_id }}

      - name: Rebuild summary
        if: always()
        run: |
          {
            echo "## Rebuild Job"
            echo
            echo "- turbo cache exact hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
            echo "- generated cache exact hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:web | ${{ steps.deploy_web.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
