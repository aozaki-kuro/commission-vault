name: Rebuild Web

on:
  repository_dispatch:
    types: [admin-data-changed]
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        id: setup

      # Check web- namespace first (full Astro build from last ci.yml web job)
      # before falling back to master- (code-only artifacts from validate).
      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-master-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-web-
            turbo-${{ runner.os }}-master-
            turbo-${{ runner.os }}-

      # Same key family as ci.yml — will get an exact hit from the last
      # successful web deploy as long as fact source inputs haven't changed.
      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      # Derive a stable token from the restored data so turbo can reuse a
      # previous Astro build when source code hasn't changed.
      - name: Derive WEB_BUILD_CACHE_TOKEN
        run: |
          if [ -f apps/web/generated/fact-source/content.json ] && \
             [ -f apps/web/generated/fact-source/source-images-manifest.json ]; then
            hash=$(sha256sum \
              apps/web/generated/fact-source/content.json \
              apps/web/generated/fact-source/source-images-manifest.json \
              | sha256sum | cut -c1-16)
            echo "WEB_BUILD_CACHE_TOKEN=data-${hash}" >> "$GITHUB_ENV"
          else
            echo "WEB_BUILD_CACHE_TOKEN=rebuild-${{ github.event.client_payload.fact_source_version || github.run_id }}" >> "$GITHUB_ENV"
          fi

      - name: Build web
        id: build_web
        run: |
          started_at=$(date +%s)
          bun run build:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web worker
        id: deploy_web
        run: |
          started_at=$(date +%s)
          bun run deploy:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save turbo cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-web-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}-${{ env.WEB_BUILD_CACHE_TOKEN }}

      - name: Save generated web inputs
        if: success() && steps.generated_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rebuild"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.setup.outputs.install-duration || 'n/a' }} |"
            echo "| build:web | ${{ steps.build_web.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:web | ${{ steps.deploy_web.outputs.duration_seconds || 'n/a' }} |"
            echo
            echo "- turbo cache hit: ${{ steps.turbo_cache.outputs.cache-hit || 'false' }}"
            echo "- generated cache hit: ${{ steps.generated_cache.outputs.cache-hit || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
