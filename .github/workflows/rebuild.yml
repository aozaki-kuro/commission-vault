name: Rebuild Web

on:
  repository_dispatch:
    types: [admin-data-changed]
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: |
          started_at=$(date +%s)
          bun install --frozen-lockfile
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Restore source images cache
        id: source_images_cache
        uses: actions/cache@v5
        with:
          path: apps/web/generated/source-images
          key: source-images-master-${{ github.run_id }}
          restore-keys: |
            source-images-master-
            source-images-

      - name: Deploy web worker
        id: deploy_web
        run: |
          started_at=$(date +%s)
          bun run deploy:web
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rebuild summary
        if: always()
        run: |
          {
            echo "## Rebuild Job"
            echo
            echo "- source-images cache hit: ${{ steps.source_images_cache.outputs.cache-hit || 'false' }}"
            echo
            echo "| Step | Seconds |"
            echo "| --- | ---: |"
            echo "| install | ${{ steps.install.outputs.duration_seconds || 'n/a' }} |"
            echo "| deploy:web | ${{ steps.deploy_web.outputs.duration_seconds || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
