default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: pnpm-install
        name: pnpm install (frozen)
        entry: pnpm install --frozen-lockfile
        language: system
        pass_filenames: false
        stages:
          - pre-commit
        always_run: true

      - id: lint-staged
        name: lint staged
        entry: pnpm lint-staged
        language: system
        pass_filenames: false
        stages:
          - pre-commit
        always_run: true

      - id: typecheck
        name: typecheck
        entry: pnpm run typecheck
        language: system
        pass_filenames: false
        stages:
          - pre-push
        always_run: true

      - id: tests
        name: vitest
        entry: pnpm run test
        language: system
        pass_filenames: false
        stages:
          - pre-push
        always_run: true

      - id: lint
        name: lint (full)
        entry: pnpm run lint
        language: system
        pass_filenames: false
        stages:
          - pre-push
        always_run: true
